[package]
name = "vcam-source"
description = "Better Cam Media Foundation virtual camera source (COM DLL loaded by Windows Frame Server)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "better_cam_vcam"
# rlib too, so unit tests can drive the COM classes in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
vcam-protocol.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell_PropertiesSystem",
]
