[package]
name = "vcam-install"
description = "Install, update, remove and inspect the Better Cam virtual camera (shared by better-cam.exe and vcam-tool)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vcam-protocol.workspace = true
windows-core.workspace = true

[dev-dependencies]
# `secure::oplock`: a test takes an opportunistic lock on a file the way a program of the user can
vcam-protocol = { workspace = true, features = ["test-support"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
