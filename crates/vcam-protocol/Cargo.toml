[package]
name = "vcam-protocol"
description = "Frame transport protocol shared by the Better Cam virtual camera DLL, the tool and the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# `secure::oplock`: take an oplock on a file, for tests of the crates that depend on this one
test-support = []

[dependencies]

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    # the frame event's security descriptor (SDDL) and the user's SID as text; the DLL links these but never calls them
    "Win32_Security_Authorization",
    # the frame event's random name (`BCryptGenRandom`), writer side only
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]
