[package]
name = "better-cam"
description = "Better Cam: webcam filter chain with its own virtual camera"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "better_cam"
path = "src/lib.rs"

[[bin]]
name = "better-cam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loads NVIDIA's Video Effects runtime (installed separately, never bundled) at run time.
libloading = "0.9"
# Extension filters (spike E1): WGSL in, HLSL out, validation is always built in. Pinned exactly: a newer release may
# write HLSL that FXC rejects (docs/SPIKE-EXT.md).
naga = { version = "=30.0.2", default-features = false, features = ["wgsl-in", "hlsl-out"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
# The `implement` macro expands to paths in `windows_core`, so the crate must be a direct dependency.
windows-core.workspace = true
vcam-protocol = { workspace = true }
vcam-install = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# `testdir`: the scratch folder of a test that removes itself
vcam-protocol = { workspace = true, features = ["test-support"] }
